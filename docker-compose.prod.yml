services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: ats_api
    image: ats-api:latest
    volumes:
      - ./storage:/app/storage
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env.prod
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - ats_network
    restart: always
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  worker:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: ats_worker
    image: ats-api:latest
    entrypoint: []
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=4
    volumes:
      - ./storage:/app/storage
    env_file:
      - .env.prod
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      disable: true
    networks:
      - ats_network
    restart: always

  postgres:
    image: postgres:16-alpine
    container_name: ats_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ats_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ats_pass}
      POSTGRES_DB: ${POSTGRES_DB:-ats_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Do NOT expose port 5432 externally in production
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ats_user} -d ${POSTGRES_DB:-ats_db}" ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ats_network
    restart: always

  redis:
    image: redis:7-alpine
    container_name: ats_redis
    volumes:
      - redis_data:/data
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    # Do NOT expose port 6379 externally in production
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ats_network
    restart: always

  n8n:
    image: n8nio/n8n:latest
    container_name: ats_n8n
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      - N8N_HOST=${N8N_HOST:-localhost}
      - N8N_PORT=5678
      - N8N_PROTOCOL=${N8N_PROTOCOL:-https}
      - GENERIC_TIMEZONE=Asia/Tashkent
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_BASIC_AUTH_USER:-admin}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_BASIC_AUTH_PASSWORD:-change_me}
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      - api
    networks:
      - ats_network
    restart: always

  minio:
    image: minio/minio:latest
    container_name: ats_minio
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:9100:9000" # S3 API — только localhost
      - "127.0.0.1:9101:9001" # Web Console — только localhost
    environment:
      - MINIO_ROOT_USER=${S3_ACCESS_KEY:-minio_admin}
      - MINIO_ROOT_PASSWORD=${S3_SECRET_KEY:-minio_password}
    volumes:
      - minio_data:/data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ats_network
    restart: always

volumes:
  postgres_data:
  redis_data:
  n8n_data:
  minio_data:


networks:
  ats_network:
    driver: bridge
