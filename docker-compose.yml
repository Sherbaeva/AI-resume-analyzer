services:
  api:
    build: .
    container_name: ats_api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app
      - ./storage:/app/storage
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://ats_user:ats_pass@postgres:5432/ats_db
      - REDIS_URL=redis://redis:6379/0
      - STORAGE_DIR=storage
      - BACKEND_URL=http://api:8000
      - N8N_WEBHOOK_URL=http://n8n:5678/webhook-test/resume-analyze
      - N8N_SECRET=change_me_in_production
      - MAX_UPLOAD_MB=10
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ats_network
    restart: unless-stopped

  worker:
    build: .
    container_name: ats_worker
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=4
    volumes:
      - .:/app
      - ./storage:/app/storage
    environment:
      - DATABASE_URL=postgresql+asyncpg://ats_user:ats_pass@postgres:5432/ats_db
      - REDIS_URL=redis://redis:6379/0
      - STORAGE_DIR=storage
      - BACKEND_URL=http://api:8000
      - N8N_WEBHOOK_URL=http://n8n:5678/webhook/resume-analyze
      - N8N_SECRET=change_me_in_production
      - MAX_UPLOAD_MB=10
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ats_network
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: ats_postgres
    environment:
      POSTGRES_USER: ats_user
      POSTGRES_PASSWORD: ats_pass
      POSTGRES_DB: ats_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ats_user -d ats_db" ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ats_network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: ats_redis
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ats_network
    restart: unless-stopped

  n8n:
    image: n8nio/n8n:latest
    container_name: ats_n8n
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - GENERIC_TIMEZONE=Asia/Tashkent
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      - api
    networks:
      - ats_network
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: ats_minio
    command: server /data --console-address ":9001"
    ports:
      - "9100:9000" # S3 API
      - "9101:9001" # MinIO Web Console
    environment:
      - MINIO_ROOT_USER=minio_admin
      - MINIO_ROOT_PASSWORD=minio_password
    volumes:
      - minio_data:/data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ats_network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  n8n_data:
  minio_data:


networks:
  ats_network:
    driver: bridge
