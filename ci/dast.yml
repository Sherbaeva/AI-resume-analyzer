zap_scan:
  stage: security
  image: 
    name: zaproxy/zap-stable:latest
    entrypoint: [""]
  script:

    - echo " Hacking ZAP to work in GitLab CI..."
    - mkdir -p /zap/wrk
    - sed -i 's/os.path.ismount/os.path.exists/g' /zap/zap_common.py
    

    - echo " Generating Auth Token Securely..."

    - >
      TOKEN=$(curl -s -X POST https://cvpilot.uz/api/auth/login 
      -H "Content-Type: application/json" 
      -d "{\"email\":\"$DAST_ADMIN_EMAIL\",\"password\":\"$DAST_ADMIN_PASSWORD\"}" 
      | python3 -c "import sys,json; print(json.load(sys.stdin).get('access_token', ''))")
    

    - >
      /zap/zap-api-scan.py -t https://cvpilot.uz/openapi.json -f openapi -r zap-report.html -I 
      -z "-config replacer.full_list(0).description=auth 
      -config replacer.full_list(0).enabled=true 
      -config replacer.full_list(0).matchtype=REQ_HEADER 
      -config replacer.full_list(0).matchstr=Authorization 
      -config replacer.full_list(0).regex=false 
      -config replacer.full_list(0).replacement='Bearer $TOKEN'"
      

    - cp /zap/wrk/zap-report.html ./zap-report.html

  artifacts:
    when: always
    paths:
      - zap-report.html
  allow_failure: true
  when: manual