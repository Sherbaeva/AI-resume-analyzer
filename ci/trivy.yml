trivy_scan:
  stage: security
  image: 
    name: aquasec/trivy:latest
    entrypoint: [""]
  script:
    - echo " Starting Trivy Vulnerability Scan..."
    # --exit-code 0 : Forces Trivy to return success so it doesn't crash the pipeline
    # --no-progress : Keeps GitLab logs clean
    # --scanners vuln,config : Scans for CVEs AND infrastructure misconfigurations (like Dockerfile mistakes)
    - trivy fs . --scanners vuln,config --exit-code 0 --no-progress --skip-files Dockerfile
  allow_failure: true

# ==========================================
# TRIVY SCANNER (Dependencies, OS, Configs)
# ==========================================
# CHEAT SHEET FOR FUTURE CUSTOMIZATION:
# 
# 1. Block the pipeline if CRITICAL bugs are found:
#    --exit-code 1 --severity CRITICAL
#
# 2. Ignore bugs that don't have a patch/fix yet:
#    --ignore-unfixed
#
# 3. Only scan for specific things:
#    --scanners vuln (Only libraries)
#    --scanners config (Only Terraform/Dockerfiles)
#    --scanners secret (Only hardcoded passwords/keys)
#
# 4. How to ignore specific False Positives:
#    Create a file named `.trivyignore` in the root of the repo.
#    Add the CVE number inside it (e.g., CVE-2023-1234).
# ==========================================
